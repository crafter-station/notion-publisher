name: schema-verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run schema:verify
      - name: No Nucleo-Lab repo links
        run: node --require ./scripts/register-test-env.cjs --require ts-node/register/transpile-only --test src/schema/repo-links.test.ts
